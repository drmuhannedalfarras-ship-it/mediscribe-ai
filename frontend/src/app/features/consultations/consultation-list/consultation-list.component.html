<div class="page-header">
  <h1>Consultations</h1>
  <a mat-raised-button color="primary" routerLink="/consultations/new">New Consultation</a>
</div>

<form [formGroup]="lookupForm" (ngSubmit)="search()" class="lookup-form">
  <mat-form-field appearance="outline">
    <mat-label>Lookup by</mat-label>
    <mat-select formControlName="mode">
      <mat-option value="patient">Patient ID</mat-option>
      <mat-option value="physician">Physician ID</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>ID</mat-label>
    <input matInput formControlName="lookupId" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">Search</button>
</form>

<table mat-table [dataSource]="consultations" *ngIf="consultations.length">
  <ng-container matColumnDef="reasonForVisit">
    <th mat-header-cell *matHeaderCellDef>Reason</th>
    <td mat-cell *matCellDef="let c">
      <a [routerLink]="['/consultations', c.id]">{{ c.reasonForVisit }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let c">{{ c.status }}</td>
  </ng-container>

  <ng-container matColumnDef="department">
    <th mat-header-cell *matHeaderCellDef>Department</th>
    <td mat-cell *matCellDef="let c">{{ c.department }}</td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created</th>
    <td mat-cell *matCellDef="let c">{{ c.createdAt | date: 'short' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<p *ngIf="searched && !loading && !consultations.length">No consultations found.</p>
