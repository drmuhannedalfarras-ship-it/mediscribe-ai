<div class="page-header">
  <h1>Patients</h1>
  <a mat-raised-button color="primary" routerLink="/patients/new">New Patient</a>
</div>

<table mat-table [dataSource]="patients" *ngIf="patients.length; else empty">
  <ng-container matColumnDef="mrn">
    <th mat-header-cell *matHeaderCellDef>MRN</th>
    <td mat-cell *matCellDef="let p">{{ p.mrn }}</td>
  </ng-container>

  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let p">
      <a [routerLink]="['/patients', p.id]">{{ p.fullName }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef>Age</th>
    <td mat-cell *matCellDef="let p">{{ p.age }}</td>
  </ng-container>

  <ng-container matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef>Gender</th>
    <td mat-cell *matCellDef="let p">{{ p.gender }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let p">{{ p.status }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<ng-template #empty>
  <p *ngIf="!loading">No patients found.</p>
</ng-template>

<mat-paginator
  *ngIf="total > 0"
  [length]="total"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  [pageSizeOptions]="[10, 25, 50, 100]"
  (page)="onPage($event)"
></mat-paginator>
